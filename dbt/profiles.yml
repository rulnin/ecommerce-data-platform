ecommerce:
  target: dev
  outputs:
    dev: &connection
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics
      threads: 2
      connect_timeout: 5
      retries: 1
    test:
      <<: *connection
      dbname: "{{ env_var('DBT_TEST_DATABASE', 'ecommerce_dbt_test') }}"
      schema: verification
    candidate:
      <<: *connection
      schema: candidate
