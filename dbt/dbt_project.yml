name: ecommerce
version: '1.0.0'
config-version: 2
profile: ecommerce
model-paths: [models]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
models:
  ecommerce:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
data_tests:
  ecommerce:
    +store_failures: true
