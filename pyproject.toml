[project]
name = "ecommerce-data-platform"
version = "0.1.0"
description = "Local-first e-commerce data engineering portfolio"
requires-python = ">=3.14.4,<3.15"
dependencies = []

[tool.uv]
package = false
python-downloads = "never"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
