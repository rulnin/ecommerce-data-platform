x-airflow: &airflow
  image: ecommerce-airflow:3.4.0-python3.14
  build:
    context: .
    dockerfile: airflow/Dockerfile
  profiles: [airflow]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python /opt/project/scripts/airflow_db_url.py
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:-}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: "8793"
    AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
    POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    RAW_DATA_DIR: /opt/project/data/raw
    SQLSERVER_HOST: sqlserver
    SQLSERVER_PORT: "1433"
    SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./data/raw:/opt/project/data/raw:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  mem_limit: 1g
  logging:
    options:
      max-size: "10m"
      max-file: "3"
services:
  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        airflow db migrate
        python - <<'PY'
        import os, subprocess
        users = subprocess.run(['airflow','users','list','--output','json'], capture_output=True, text=True)
        if '"admin"' not in users.stdout:
            result = subprocess.run(['airflow','users','create','--username','admin','--firstname','Local','--lastname','Reviewer','--role','Admin','--email','local@example.invalid','--password',os.environ['AIRFLOW_ADMIN_PASSWORD']], capture_output=True)
            if result.returncode:
                raise SystemExit('Admin creation failed; inspect metadata setup without printing credentials')
        PY
  airflow-api:
    <<: *airflow
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  airflow-scheduler:
    <<: *airflow
    command: scheduler
    mem_limit: 2g
    hostname: airflow-scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 12
  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname $$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 12
volumes:
  airflow_logs:
